name: Desktop Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.171); prepare RELEASE_NOTES.md first'
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: desktop-distribution-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            profile: dist-windows-exe
            artifact_name: quantum-ir-studio-windows-exe
            artifact_glob: quantum-desktop/target/dist/*.exe
          - name: windows-msi
            os: windows-latest
            profile: dist-windows-msi
            artifact_name: quantum-ir-studio-windows-msi
            artifact_glob: quantum-desktop/target/dist/*.msi
          - name: linux
            os: ubuntu-latest
            profile: dist-linux-deb
            artifact_name: quantum-ir-studio-linux
            artifact_glob: quantum-desktop/target/dist/*.deb
          - name: macos
            os: macos-latest
            profile: dist-macos-dmg
            artifact_name: quantum-ir-studio-macos
            artifact_glob: quantum-desktop/target/dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION}"
          if [ -z "${VERSION}" ]; then
            echo "Release version is empty." >&2
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use major.minor.patch without leading zeroes, for example 1.0.171: ${VERSION}" >&2
            exit 1
          fi
          echo "Release version: ${VERSION}"
          mvn -B -pl quantum-desktop -am verify -P${{ matrix.profile }} -Drevision="${VERSION}" -DskipTests

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Publish versioned release
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate release version
        id: version
        run: |
          VERSION="${RELEASE_VERSION}"
          if [ -z "${VERSION}" ]; then
            echo "Release version is empty." >&2
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use major.minor.patch without leading zeroes, for example 1.0.171: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Normalize asset names
        run: |
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          find release-assets -type f -name "*.exe" -exec cp "{}" "release/quantum-ir-studio-${VERSION}-windows.exe" \;
          find release-assets -type f -name "*.msi" -exec cp "{}" "release/quantum-ir-studio-${VERSION}-windows.msi" \;
          find release-assets -type f -name "*.deb" -exec cp "{}" "release/quantum-ir-studio-${VERSION}-linux.deb" \;
          find release-assets -type f -name "*.dmg" -exec cp "{}" "release/quantum-ir-studio-${VERSION}-macos.dmg" \;
          ls -la release

      - name: Publish a new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Choose a new version; published assets are immutable." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "Existing tag ${TAG} points to a different commit; it will not be moved." >&2
              exit 1
            fi
          fi
          test -s RELEASE_NOTES.md
          gh release create "${TAG}" release/* \
            --title "Quantum IR Studio ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_SHA}"
